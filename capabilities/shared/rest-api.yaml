naftiko: "1.0.0-alpha1"

info:
  label: "Apache Ignite REST API"
  description: "Shared per-API capability definition for the Apache Ignite 3 REST API covering cluster management, node management, SQL execution, and configuration."
  tags:
    - Apache Ignite
    - Cluster Management
    - In-Memory Database
    - REST
  created: "2026-04-19"
  modified: "2026-04-19"

binds:
  - namespace: env
    keys:
      IGNITE_BASIC_AUTH: IGNITE_BASIC_AUTH

capability:
  consumes:
    - type: http
      namespace: ignite-rest-api
      baseUri: http://localhost:10300
      description: "Apache Ignite 3 REST API for cluster and node management."
      authentication:
        type: basic
        username: "{{IGNITE_USER}}"
        password: "{{IGNITE_PASSWORD}}"
      resources:
        - name: cluster
          path: /management/v1/cluster
          description: Cluster lifecycle management
          operations:
            - name: get-cluster-state
              method: GET
              description: Get cluster state
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: init-cluster
              method: POST
              description: Initialize cluster
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: sql
          path: /management/v1/sql
          description: SQL query execution
          operations:
            - name: execute-sql
              method: POST
              description: Execute SQL query
              inputParameters:
                - name: query
                  in: body
                  type: string
                  required: true
                  description: SQL query to execute
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: configuration
          path: /management/v1/configuration
          description: Cluster configuration management
          operations:
            - name: get-configuration
              method: GET
              description: Get cluster configuration
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: update-configuration
              method: PATCH
              description: Update cluster configuration
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: ignite-rest-api-exposed
      resources:
        - path: /v1/cluster
          name: cluster
          operations:
            - method: GET
              name: get-cluster-state
              description: Get cluster state
              call: "ignite-rest-api.get-cluster-state"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: ignite-rest-api-mcp
      transport: http
      tools:
        - name: get-cluster-state
          description: Get the current state of the Ignite cluster
          hints:
            readOnly: true
          call: "ignite-rest-api.get-cluster-state"
          outputParameters:
            - type: object
              mapping: "$."
        - name: execute-sql
          description: Execute a SQL query on the Ignite cluster
          hints:
            readOnly: false
          call: "ignite-rest-api.execute-sql"
          with:
            query: "tools.query"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-configuration
          description: Get the current Ignite cluster configuration
          hints:
            readOnly: true
          call: "ignite-rest-api.get-configuration"
          outputParameters:
            - type: object
              mapping: "$."

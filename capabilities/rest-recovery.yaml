          in: query
          type: array
        - name: nodeNames
          in: query
          type: array
        - name: partitionIds
          in: query
          type: array
    authentication:
      type: basic
      username: '{{env.APACHE_IGNITE_USER}}'
      password: '{{env.APACHE_IGNITE_PASS}}'

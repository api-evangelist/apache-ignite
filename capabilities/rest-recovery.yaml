          type: array
    - name: management-v1-recovery-zone-state-local
      path: /management/v1/recovery/zone/state/local
      operations:
      - name: getzonelocalpartitionstates
        method: GET
        description: Returns local zone partition states.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:

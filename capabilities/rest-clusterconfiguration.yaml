naftiko: 1.0.0-alpha2
info:
  label: Apache Ignite REST module — clusterConfiguration
  description: 'Apache Ignite REST module — clusterConfiguration. 3 operations. Lead operation: Apache Ignite Get Cluster
    Configuration. Self-contained Naftiko capability covering one Apache Ignite business surface.'
  tags:
  - Apache Ignite
  - clusterConfiguration
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    APACHE_IGNITE_API_KEY: APACHE_IGNITE_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-clusterconfiguration
    baseUri: http://localhost:10300
    description: Apache Ignite REST module — clusterConfiguration business capability. Self-contained, no shared references.
    resources:
    - name: management-v1-configuration-cluster
      path: /management/v1/configuration/cluster
      operations:
      - name: getclusterconfiguration
        method: GET
        description: Apache Ignite Get Cluster Configuration
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updateclusterconfiguration
        method: PATCH
        description: Apache Ignite Update Cluster Configuration
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: management-v1-configuration-cluster-path
      path: /management/v1/configuration/cluster/{path}
      operations:
      - name: getclusterconfigurationbypath
        method: GET
        description: Apache Ignite Get Configuration Represented by Path
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: path
          in: path
          type: string
          description: 'Configuration tree address. For example: `element.subelement`.'
          required: true
    authentication:
      type: basic
      username: '{{env.APACHE_IGNITE_USER}}'
      password: '{{env.APACHE_IGNITE_PASS}}'
  exposes:
  - type: rest
    namespace: rest-clusterconfiguration-rest
    port: 8080
    description: REST adapter for Apache Ignite REST module — clusterConfiguration. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/management/v1/configuration/cluster
      name: management-v1-configuration-cluster
      description: REST surface for management-v1-configuration-cluster.
      operations:
      - method: GET
        name: getclusterconfiguration
        description: Apache Ignite Get Cluster Configuration
        call: rest-clusterconfiguration.getclusterconfiguration
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updateclusterconfiguration
        description: Apache Ignite Update Cluster Configuration
        call: rest-clusterconfiguration.updateclusterconfiguration
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/management/v1/configuration/cluster/{path}
      name: management-v1-configuration-cluster-path
      description: REST surface for management-v1-configuration-cluster-path.
      operations:
      - method: GET
        name: getclusterconfigurationbypath
        description: Apache Ignite Get Configuration Represented by Path
        call: rest-clusterconfiguration.getclusterconfigurationbypath
        with:
          path: rest.path
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-clusterconfiguration-mcp
    port: 9090
    transport: http
    description: MCP adapter for Apache Ignite REST module — clusterConfiguration. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: apache-ignite-get-cluster-configuration
      description: Apache Ignite Get Cluster Configuration
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-clusterconfiguration.getclusterconfiguration
      outputParameters:
      - type: object
        mapping: $.
    - name: apache-ignite-update-cluster-configuration
      description: Apache Ignite Update Cluster Configuration
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: rest-clusterconfiguration.updateclusterconfiguration
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: apache-ignite-get-configuration-represented
      description: Apache Ignite Get Configuration Represented by Path
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-clusterconfiguration.getclusterconfigurationbypath
      with:
        path: tools.path
      outputParameters:
      - type: object
        mapping: $.

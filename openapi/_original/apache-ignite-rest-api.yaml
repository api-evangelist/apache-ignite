components:
  schemas:
    ClusterNode:
      type: object
      properties:
        id:
          type: string
          description: Node ID.
          format: uuid
        name:
          type: string
          description: Unique cluster name.
        address:
          allOf:
          - $ref: '#/components/schemas/NetworkAddress'
          - description: Cluster network address information.
        metadata:
          allOf:
          - $ref: '#/components/schemas/NodeMetadata'
          - description: Node metadata information.
      description: Information about the cluster node.
    ClusterState:
      type: object
      properties:
        cmgNodes:
          type: array
          description: List of cluster management group nodes. These nodes are responsible for maintaining RAFT cluster topology.
          items:
            type: string
        msNodes:
          type: array
          description: List of metastorage nodes. These nodes are responsible for storing RAFT cluster metadata.
          items:
            type: string
        igniteVersion:
          type: string
          description: Version of Apache Ignite that the cluster was created on.
        clusterTag:
          allOf:
          - $ref: '#/components/schemas/ClusterTag'
          - description: Unique tag that identifies the cluster.
        formerClusterIds:
          type: array
          description: IDs the cluster had before.
          nullable: true
          items:
            type: string
            format: uuid
      description: Information about current cluster state.
    ClusterTag:
      type: object
      properties:
        clusterId:
          type: string
          description: Unique cluster UUID. Generated automatically.
          format: uuid
        clusterName:
          type: string
          description: Unique cluster name.
      description: Unique tag that identifies the cluster.
    DeploymentStatus:
      type: string
      description: Status of deployment process.
      enum:
      - UPLOADING
      - DEPLOYED
      - OBSOLETE
      - REMOVING
    GlobalPartitionStateResponse:
      required:
      - partitionId
      - schemaName
      - state
      - tableId
      - tableName
      - zoneName
      type: object
      properties:
        partitionId:
          type: integer
          format: int32
        zoneName:
          type: string
        tableId:
          type: integer
          format: int32
        schemaName:
          type: string
        tableName:
          type: string
        state:
          type: string
      description: Information about global partition state.
    GlobalPartitionStatesResponse:
      type: object
      properties:
        states:
          type: array
          items:
            $ref: '#/components/schemas/GlobalPartitionStateResponse'
      description: Information about global partition states.
    GlobalZonePartitionStateResponse:
      required:
      - partitionId
      - state
      - zoneName
      type: object
      properties:
        partitionId:
          type: integer
          format: int32
        zoneName:
          type: string
        state:
          type: string
      description: Information about global zone partition state.
    GlobalZonePartitionStatesResponse:
      type: object
      properties:
        states:
          type: array
          items:
            $ref: '#/components/schemas/GlobalZonePartitionStateResponse'
      description: Information about global zone partition states.
    InitCommand:
      type: object
      properties:
        metaStorageNodes:
          type: array
          description: A list of RAFT metastorage nodes.
          items:
            type: string
        cmgNodes:
          type: array
          description: A list of RAFT cluster management nodes.
          items:
            type: string
        clusterName:
          type: string
          description: The name of the cluster.
        clusterConfiguration:
          type: string
          description: Cluster configuration in HOCON format.
      description: Cluster initialization configuration.
    InvalidParam:
      type: object
      properties:
        name:
          type: string
          description: Parameter name.
        reason:
          type: string
          description: The issue with the parameter.
      description: Information about invalid request parameter.
    JobState:
      required:
      - createTime
      - id
      - status
      type: object
      properties:
        id:
          type: string
          description: Job ID.
          format: uuid
        status:
          description: Job status.
          allOf:
          - $ref: '#/components/schemas/JobStatus'
          - {}
        createTime:
          type: string
          description: Job create time.
          format: date-time
        startTime:
          type: string
          description: Job start time.
          format: date-time
          nullable: true
        finishTime:
          type: string
          description: Job finish time.
          format: date-time
          nullable: true
      description: Rest representation of org.apache.ignite.compute.JobState.
    JobStatus:
      type: string
      description: Job status.
      enum:
      - QUEUED
      - EXECUTING
      - FAILED
      - COMPLETED
      - CANCELING
      - CANCELED
    LocalPartitionStateResponse:
      required:
      - estimatedRows
      - nodeName
      - partitionId
      - schemaName
      - state
      - tableId
      - tableName
      - zoneName
      type: object
      properties:
        partitionId:
          type: integer
          format: int32
        zoneName:
          type: string
        tableId:
          type: integer
          format: int32
        schemaName:
          type: string
        tableName:
          type: string
        nodeName:
          type: string
        state:
          type: string
        estimatedRows:
          type: integer
          format: int64
      description: Information about local partition state.
    LocalPartitionStatesResponse:
      type: object
      properties:
        states:
          type: array
          items:
            $ref: '#/components/schemas/LocalPartitionStateResponse'
      description: Information about local partition states.
    LocalZonePartitionStateResponse:
      required:
      - estimatedRows
      - nodeName
      - partitionId
      - state
      - zoneName
      type: object
      properties:
        partitionId:
          type: integer
          format: int32
        zoneName:
          type: string
        nodeName:
          type: string
        state:
          type: string
        estimatedRows:
          type: integer
          format: int64
      description: Information about local zone partition state.
    LocalZonePartitionStatesResponse:
      type: object
      properties:
        states:
          type: array
          items:
            $ref: '#/components/schemas/LocalZonePartitionStateResponse'
      description: Information about local zone partition states.
    Metric:
      type: object
      properties:
        name:
          type: string
          description: Metric name.
        desc:
          type: string
          description: Metric description.
          nullable: true
      description: Metric representation.
    MetricSet:
      required:
      - metrics
      - name
      type: object
      properties:
        name:
          type: string
          description: Metric set name.
        metrics:
          type: array
          description: Metrics.
          items:
            $ref: '#/components/schemas/Metric'
      description: Metrics set representation.
    MetricSource:
      required:
      - enabled
      - name
      type: object
      properties:
        name:
          type: string
          description: Metric source name.
        enabled:
          type: boolean
          description: "If True, the metric is tracked. Otherwise, the metric is not tracked."
      description: A list of metric sources provided by modules.
    MigrateRequest:
      type: object
      properties:
        cmgNodes:
          type: array
          description: Names of the CMG node names.
          items:
            type: string
        metaStorageNodes:
          type: array
          description: Names of the Metastorage node names.
          items:
            type: string
        version:
          type: string
          description: Ignite version.
        clusterId:
          type: string
          description: ID of the cluster.
          format: uuid
        clusterName:
          type: string
          description: Name of the cluster.
        formerClusterIds:
          type: array
          description: "IDs the cluster had before. If CMG/Metastorage group were never repaired, this is null."
          nullable: true
          items:
            type: string
            format: uuid
      description: Migrate nodes to new cluster.
    NetworkAddress:
      type: object
      properties:
        host:
          type: string
          description: Name of the host node runs on.
        port:
          type: integer
          description: Port the node runs on.
          format: int32
      description: Node network address information.
    NodeInfo:
      required:
      - jdbcPort
      - name
      type: object
      properties:
        name:
          type: string
          description: Unique node name.
        jdbcPort:
          type: integer
          description: Node JDBC port.
          format: int32
      description: Node info.
    NodeMetadata:
      type: object
      properties:
        restHost:
          type: string
          description: The host exposed to REST API.
        httpPort:
          type: integer
          description: The HTTP port exposed to REST API.
          format: int32
        httpsPort:
          type: integer
          description: The HTTPS port exposed to REST API.
          format: int32
      description: Node metadata information.
    NodeMetricSources:
      required:
      - node
      - sources
      type: object
      properties:
        node:
          type: string
          description: Consistent id of the node.
        sources:
          type: array
          description: Metric sources.
          items:
            $ref: '#/components/schemas/MetricSource'
      description: A list of metric sources for a node.
    NodeState:
      required:
      - name
      - state
      type: object
      properties:
        name:
          type: string
          description: Unique node name.
        state:
          allOf:
          - $ref: '#/components/schemas/State'
          - description: Node state.
      description: Node state.
    NodeVersion:
      required:
      - product
      - version
      type: object
      properties:
        version:
          type: string
          description: Node version.
        product:
          type: string
          description: Node product.
      description: Node version.
    Problem:
      type: object
      properties:
        title:
          type: string
          description: Short summary of the issue.
        status:
          type: integer
          description: Returned HTTP status code.
          format: int32
        code:
          type: string
          description: Ignite 3 error code.
        type:
          type: string
          description: URI to documentation regarding the issue.
        detail:
          type: string
          description: Extended explanation of the issue.
        node:
          type: string
          description: Name of the node the issue happened on.
        traceId:
          type: string
          description: Unique issue identifier. This identifier can be used to find logs related to the issue.
          format: uuid
        invalidParams:
          type: array
          description: A list of parameters that did not pass validation and the reason for it.
          items:
            $ref: '#/components/schemas/InvalidParam'
      description: Extended description of the problem with the request.
    ResetClusterRequest:
      type: object
      properties:
        cmgNodeNames:
          type: array
          description: "Names of the proposed CMG nodes. Optional if the MG group is being repaired. If not specified, the current CMG nodes are used."
          nullable: true
          items:
            type: string
        metastorageReplicationFactor:
          type: integer
          description: Number of nodes in the voting member set of the Metastorage RAFT group.
          format: int32
          nullable: true
      description: Reset cluster.
    ResetPartitionsRequest:
      type: object
      properties:
        zoneName:
          type: string
          description: "Name of the zone to reset partitions of. Without quotes, case-sensitive."
        partitionIds:
          type: array
          description: IDs of partitions to reset. All if empty.
          items:
            type: integer
            format: int32
        tableName:
          type: string
          description: "Fully-qualified name of the table to reset partitions of. Without quotes, case-sensitive."
      description: Reset partitions configuration.
    ResetZonePartitionsRequest:
      type: object
      properties:
        zoneName:
          type: string
          description: "Name of the zone to reset partitions of. Without quotes, case-sensitive."
        partitionIds:
          type: array
          description: IDs of partitions to reset. All if empty.
          items:
            type: integer
            format: int32
      description: Reset zone partitions configuration.
    RestartPartitionsRequest:
      type: object
      properties:
        nodeNames:
          type: array
          description: "Names specifying nodes to restart partitions. Case-sensitive. If empty/omitted, partitions on all nodes are restarted."
          items:
            type: string
        zoneName:
          type: string
          description: "Name of the zone to restart partitions of. Without quotes, case-sensitive."
        partitionIds:
          type: array
          description: "IDs of partitions to restart. If empty/omitted, all partitions will be restarted."
          items:
            type: integer
            format: int32
        tableName:
          type: string
          description: Fully-qualified name of the table to restart partitions of.
      description: restart partitions configuration.
    RestartZonePartitionsRequest:
      type: object
      properties:
        nodeNames:
          type: array
          description: "Names specifying nodes to restart zone partitions. Case-sensitive. If empty/omitted, partitions on all nodes are restarted."
          items:
            type: string
        zoneName:
          type: string
          description: "Name of the zone to restart partitions of. Without quotes, case-sensitive."
        partitionIds:
          type: array
          description: "IDs of partitions to restart. If empty/omitted, all partitions will be restarted."
          items:
            type: integer
            format: int32
      description: restart partitions configuration.
    SqlQuery:
      required:
      - id
      - node
      - phase
      - schema
      - sql
      - startTime
      - type
      type: object
      properties:
        id:
          type: string
          description: Sql query ID.
          format: uuid
        node:
          type: string
          description: Initiator node.
        phase:
          type: string
          description: Phase.
        type:
          type: string
          description: Type.
        schema:
          type: string
          description: Schema.
        sql:
          type: string
          description: SQL statement.
        startTime:
          type: string
          description: Start time.
          format: date-time
      description: Rest representation of sql query.
    State:
      type: string
      description: Possible node states.
      enum:
      - STARTING
      - STARTED
      - STOPPING
    Transaction:
      required:
      - id
      - node
      - priority
      - startTime
      - state
      - type
      type: object
      properties:
        id:
          type: string
          description: Transaction ID.
          format: uuid
        node:
          type: string
          description: Coordinator node.
        state:
          type: string
          description: State.
        type:
          type: string
          description: Type.
        priority:
          type: string
          description: Priority.
        startTime:
          type: string
          description: Start time.
          format: date-time
      description: Rest representation of transaction.
    UnitStatus:
      required:
      - id
      - versionToStatus
      type: object
      properties:
        id:
          type: string
          description: Unit identifier.
        versionToStatus:
          type: array
          description: Map from unit version to unit deployment status.
          items:
            $ref: '#/components/schemas/UnitVersionStatus'
      description: Unit status.
    UnitVersionStatus:
      required:
      - status
      - version
      type: object
      properties:
        version:
          type: string
          description: Unit version.
        status:
          allOf:
          - $ref: '#/components/schemas/DeploymentStatus'
          - description: Unit status.
      description: Unit version and status.
    UpdateJobPriorityBody:
      required:
      - priority
      type: object
      properties:
        priority:
          type: integer
          description: Priority.
          format: int32
      description: DTO of update job priority request body.
    deployMode:
      type: string
      description: Initial set of nodes to deploy.
      enum:
      - MAJORITY
      - ALL
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
